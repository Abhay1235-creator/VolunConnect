
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Opportunities | VolunConnect</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/volunteer.css">

  <script src="storage.js" defer></script>
  <script src="script.js" defer></script>
  <link rel="icon" href="https://api.iconify.design/lucide/search.svg?color=%230d9488" type="image/svg+xml">
</head>

<body class="dashboard-body volunteer-dashboard">

<div class="dashboard-layout">

  <aside class="sidebar" id="volunteer-sidebar">
    <a href="index.html" class="brand sidebar-brand">
      <span class="brand-icon" aria-hidden="true">♥</span>
      <span>VolunConnect</span>
    </a>

    <p class="sidebar-label">WORKSPACE</p>

    <nav class="sidebar-nav" aria-label="Volunteer navigation">
      <a href="dashboard.html" class="sidebar-link">▦ Dashboard</a>
      <a href="opportunities.html" class="sidebar-link active">⌕ Browse Opportunities</a>
      <a href="applications.html" class="sidebar-link">▤ My Applications</a>
      <a href="profile.html" class="sidebar-link">♙ My Profile</a>
      <a href="certificates.html" class="sidebar-link">♧ Certificates</a>
      <a href="notifications.html" class="sidebar-link">♧ Notifications</a>
    </nav>

    <div class="sidebar-bottom">
      <a href="login.html" class="sidebar-link" data-logout>↪ Logout</a>
    </div>
  </aside>

  <div class="dashboard-main">

    <header class="dashboard-topbar">
      <button
        type="button"
        class="sidebar-toggle"
        id="volunteer-menu-toggle"
        aria-controls="volunteer-sidebar"
        aria-expanded="false"
        aria-label="Toggle sidebar"
      >☰</button>

      <div class="topbar-spacer"></div>

      <a href="applications.html" class="topbar-notification">▤</a>

      <div class="topbar-user">
        <div class="avatar">V</div>
        <div class="topbar-user-info">
          <strong id="volunteer-name">Volunteer</strong>
          <span>Volunteer</span>
        </div>
      </div>
    </header>

    <main class="dashboard-content">

      <div class="welcome-row">
        <div>
          <span class="eyebrow">MAKE AN IMPACT</span>
          <h1>Browse Opportunities</h1>
          <p>Find meaningful ways to support your community.</p>
        </div>
      </div>

      <section class="opportunity-toolbar">
        <div class="opportunity-search">
          <label for="event-search">Search events</label>
          <input
            type="search"
            id="event-search"
            placeholder="Search by title or location..."
          >
        </div>

        <div class="opportunity-search">
          <label for="event-category">Category</label>
          <select id="event-category">
            <option value="all">All categories</option>
            <option value="environment">Environment</option>
            <option value="education">Education</option>
            <option value="community">Community</option>
            <option value="healthcare">Healthcare</option>
          </select>
        </div>
      </section>

      <div class="listing-summary">
        <span id="event-count">Loading opportunities...</span>
      </div>

      <section
        id="opportunity-grid"
        class="opportunity-grid"
        aria-live="polite"
      >
        <p>Loading opportunities...</p>
      </section>

    </main>
  </div>
</div>

</body>
</html>
