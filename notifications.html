<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | VolunConnect</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/admin.css">

  <script src="storage.js" defer></script>
  <script src="script.js" defer></script>

  <link
    rel="icon"
    href="https://api.iconify.design/lucide/bell.svg?color=%23ea580c"
    type="image/svg+xml"
  >
</head>

<body class="admin-dashboard shared-notifications-page">
  <div class="dashboard-layout">

    <aside class="sidebar">
      <div class="sidebar-brand">
        <h2>VolunConnect</h2>
        <p id="notifications-user-role">Dashboard</p>
      </div>

      <nav class="sidebar-nav" id="notifications-sidebar-nav">
        <!-- Navigation is generated according to the logged-in role. -->
      </nav>

      <div class="sidebar-footer">
        <p>
          Logged in as
          <strong id="notifications-user-name">User</strong>
        </p>
        <button type="button" id="logout-btn">Logout</button>
      </div>
    </aside>

    <main class="dashboard-main">
      <header class="dashboard-header">
        <div>
          <h1>Notifications</h1>
          <p id="notifications-page-description">
            Your recent notifications.
          </p>
        </div>

        <button type="button" id="mark-all-read-btn">
          Mark All as Read
        </button>
      </header>

      <section class="dashboard-section">
        <div class="section-heading">
          <h2>Recent Notifications</h2>
          <span id="notification-count">0 notifications</span>
        </div>

        <p id="notifications-message" role="status"></p>

        <div id="admin-notifications-list">
          <p>Loading notifications...</p>
        </div>
      </section>
    </main>

  </div>
</body>
</html>
