<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | VolunConnect</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="admin.css">
  <script src="storage.js" defer></script>
  <script src="script.js" defer></script>
  <link rel="icon" href="https://api.iconify.design/lucide/bell.svg?color=%23ea580c" type="image/svg+xml">
</head>
<body class="admin-dashboard">
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h2>VolunConnect</h2>
        <p>Admin Panel</p>
      </div>

      <nav class="sidebar-nav">
        <a href="admin.html">Dashboard</a>
        <a href="manage-events.html">Manage Events</a>
        <a href="admin-applications.html">Applications</a>
        <a href="manage-volunteers.html">Volunteers</a>
        <a href="reports.html">Reports & Analytics</a>
        <a href="notifications.html" class="active">Notifications</a>
      </nav>

      <div class="sidebar-footer">
        <p>Logged in as <strong id="admin-name">Admin</strong></p>
        <button type="button" id="logout-btn">Logout</button>
      </div>
    </aside>

    <main class="dashboard-main">
      <header class="dashboard-header">
        <div>
          <h1>Notifications</h1>
          <p>Review recent activity across VolunConnect.</p>
        </div>
        <button type="button" id="mark-all-read-btn">
          Mark All as Read
        </button>
      </header>

      <section class="dashboard-section">
        <div class="section-heading">
          <h2>Recent Notifications</h2>
          <span id="notification-count">0 notifications</span>
        </div>

        <p id="notifications-message" role="status"></p>

        <div id="admin-notifications-list">
          <p>Loading notifications...</p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
